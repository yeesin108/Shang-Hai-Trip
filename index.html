<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>华东九日行｜随行卡与云记账</title>

  <!-- Tailwind CSS & Alpine.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Firebase SDK (支持多人云端同步) -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #f6f5f0; color: #2c2c2c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chinese-border { border: 1px solid #e2ded4; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24">

  <div x-data="appData()" class="max-w-md mx-auto min-h-screen flex flex-col">
    
    <header class="bg-[#2d3a3a] text-[#e8e4d9] p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-widest">华东九日游</h1>
        <p class="text-[11px] text-gray-300">上海·无锡·苏州·乌镇·杭州</p>
      </div>
      <div class="text-right">
        <span class="text-[10px] border border-[#a39382] px-2 py-0.5 rounded text-[#e8e4d9]">5人包车团</span>
        <div x-show="syncMode" class="text-[9px] text-emerald-400 mt-1">🟢 多人云端同步中</div>
        <div x-show="!syncMode" class="text-[9px] text-orange-300 mt-1">🟡 单机离线模式</div>
      </div>
    </header>

    <main class="flex-1 p-4">
      
      <!-- ================= 模块一：每日行程 ================= -->
      <div x-show="currentTab === 'itinerary'">
        <div class="flex overflow-x-auto space-x-2 pb-3 mb-3 border-b border-gray-300 no-scrollbar">
          <template x-for="(day, index) in itinerary" :key="index">
            <button @click="selectedDay = index" 
                    :class="selectedDay === index ? 'bg-[#2d3a3a] text-white' : 'bg-white text-gray-700 chinese-border'"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all flex flex-col items-center">
              <span class="font-bold text-sm" x-text="'D' + (index + 1)"></span>
              <span class="text-[10px] opacity-80" x-text="day.date"></span>
            </button>
          </template>
        </div>

        <div class="space-y-4">
          <template x-for="item in itinerary[selectedDay].items" :key="item.time">
            <div x-data="{ expanded: false }" class="bg-white rounded-xl p-4 chinese-border shadow-sm">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded" x-text="item.time"></span>
                <span class="text-[11px] px-2 py-0.5 rounded font-medium bg-gray-50 border border-gray-200" x-text="item.type"></span>
              </div>
              <h3 class="font-bold text-gray-800 text-base mb-1" x-text="item.title"></h3>
              <p class="text-xs text-gray-600 mb-3 leading-relaxed" x-text="item.desc"></p>

              <!-- 深度攻略与真实照片 -->
              <template x-if="item.details">
                <div class="mb-3">
                  <button @click="expanded = !expanded" class="w-full text-left flex justify-between items-center bg-gray-50 py-2.5 px-3 rounded-lg text-[11px] text-[#2d3a3a] font-bold active:bg-gray-100 border border-gray-100">
                    <span x-text="expanded ? '收起保姆级攻略' : '📖 展开实测动线与图集'"></span>
                    <span x-text="expanded ? '▲' : '▼'" class="text-[10px] text-gray-400"></span>
                  </button>
                  <div x-show="expanded" x-collapse class="mt-3">
                    <template x-for="detail in item.details" :key="detail.title">
                      <div class="mb-4">
                        <h4 class="text-[11px] font-bold text-gray-800 mb-2 border-l-2 border-[#2d3a3a] pl-2" x-text="detail.title"></h4>
                        <ul class="space-y-1.5 text-[11px] text-gray-600 mb-3 pl-1">
                          <template x-for="point in detail.points" :key="point">
                            <li x-html="point" class="leading-relaxed bg-gray-50 p-1.5 rounded"></li>
                          </template>
                        </ul>
                        <!-- 横向图集 -->
                        <template x-if="detail.images && detail.images.length > 0">
                          <div class="flex overflow-x-auto snap-x space-x-2 pb-2 no-scrollbar">
                            <template x-for="img in detail.images" :key="img">
                              <img :src="img" class="w-32 h-44 object-cover rounded-md shadow-sm snap-center shrink-0 border border-gray-200" loading="lazy">
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              
              <!-- 百度地图 App 唤起 -->
              <template x-if="item.location">
                <div class="pt-2 border-t border-gray-100 flex justify-between items-center mt-2">
                  <span class="text-[10px] text-gray-400 truncate max-w-[160px]" x-text="'📍 ' + item.location"></span>
                  <button @click="openBaiduMap(item.location)" class="text-[11px] text-blue-600 bg-blue-50 border border-blue-100 px-3 py-1.5 rounded-full font-medium">
                    🧭 导航/打车
                  </button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- ================= 模块二：多人云端记账 ================= -->
      <div x-show="currentTab === 'accounting'" class="space-y-4">
        
        <!-- 记账输入表单 -->
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-3 flex items-center justify-between">
            <span>✍️ 记一笔</span>
          </h2>
          <div class="space-y-3">
            <div class="flex gap-2">
              <input type="date" x-model="form.date" class="text-xs border border-gray-300 rounded p-2 flex-1 bg-gray-50">
              <select x-model="form.category" class="text-xs border border-gray-300 rounded p-2 flex-1 bg-gray-50">
                <template x-for="cat in categories" :key="cat"><option :value="cat" x-text="cat"></option></template>
              </select>
            </div>
            <div class="flex gap-2">
              <select x-model="form.payer" class="text-xs border border-gray-300 rounded p-2 w-24 bg-gray-50 text-[#2d3a3a] font-bold">
                <template x-for="p in payers" :key="p"><option :value="p" x-text="p + ' 支付'"></option></template>
              </select>
              <input type="text" x-model="form.item" placeholder="花费明细 (如: 老吉士晚餐)" class="text-xs border border-gray-300 rounded p-2 flex-1">
            </div>
            <div class="flex gap-2 items-center">
              <span class="font-bold text-gray-600">¥</span>
              <input type="number" x-model="form.amount" placeholder="0.00" class="text-sm border border-gray-300 rounded p-2 flex-1 font-mono">
              <button @click="addExpense()" class="bg-[#2d3a3a] text-white px-5 py-2 rounded text-xs font-bold active:bg-gray-800">提交</button>
            </div>
          </div>
        </div>

        <!-- 财务汇总看板 -->
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <div class="flex justify-between items-end border-b pb-3 mb-3">
            <div>
              <span class="text-[10px] text-gray-500 block mb-1">旅行总计花费 (¥)</span>
              <span class="text-2xl font-bold text-[#2d3a3a] font-mono" x-text="totalAmount.toFixed(2)"></span>
            </div>
            <select x-model="filterDate" class="text-[10px] border rounded px-2 py-1 bg-gray-50">
              <option value="all">全部日期</option>
              <template x-for="d in uniqueDates" :key="d"><option :value="d" x-text="d"></option></template>
            </select>
          </div>

          <!-- 谁支付了多少 -->
          <div class="mb-4">
            <span class="text-[10px] text-gray-500 block mb-2 font-bold">支付人看板</span>
            <div class="flex flex-wrap gap-2">
              <template x-for="(amt, payer) in payerTotals" :key="payer">
                <div class="bg-orange-50 border border-orange-100 px-2 py-1.5 rounded-md flex-1 min-w-[60px] text-center">
                  <div class="text-[10px] text-gray-600" x-text="payer"></div>
                  <div class="text-[11px] font-bold text-orange-700" x-text="'¥' + amt"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- 分类饼图/列表 -->
          <div>
            <span class="text-[10px] text-gray-500 block mb-2 font-bold">分类明细 (当前筛选)</span>
            <div class="space-y-1.5">
              <template x-for="(amt, cat) in categoryTotals" :key="cat">
                <div class="flex justify-between items-center text-[11px] bg-gray-50 px-2 py-1 rounded">
                  <span class="text-gray-600" x-text="cat"></span>
                  <span class="font-mono font-medium" x-text="'¥' + amt"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- 账单流水明细 -->
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-3 text-xs">流水明细</h2>
          <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
            <template x-for="exp in filteredExpenses" :key="exp.id">
              <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <div>
                  <div class="flex items-center gap-1.5 mb-0.5">
                    <span class="text-[9px] bg-gray-200 text-gray-600 px-1 rounded" x-text="exp.category"></span>
                    <span class="text-[11px] font-bold text-gray-800" x-text="exp.item"></span>
                  </div>
                  <div class="text-[9px] text-gray-400" x-text="exp.date + ' | ' + exp.payer + ' 支付'"></div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-sm font-bold font-mono text-[#2d3a3a]" x-text="'¥' + parseFloat(exp.amount).toFixed(2)"></span>
                  <button @click="deleteExpense(exp.id)" class="text-red-400 text-[10px] px-1 py-0.5 border border-red-100 rounded">删</button>
                </div>
              </div>
            </template>
            <div x-show="filteredExpenses.length === 0" class="text-center text-[10px] text-gray-400 py-4">暂无记录</div>
          </div>
        </div>
      </div>

    </main>

    <!-- 底部 Tab -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-50">
      <button @click="currentTab = 'itinerary'" :class="currentTab === 'itinerary' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-lg leading-none mb-1">📅</div>
        <div class="text-[10px] font-bold">行程攻略</div>
      </button>
      <button @click="currentTab = 'accounting'" :class="currentTab === 'accounting' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-lg leading-none mb-1">💰</div>
        <div class="text-[10px] font-bold">云记账</div>
      </button>
    </nav>
  </div>

  <script>
    // ==========================================
    // ⚠️ Firebase 多人同步数据库配置区 (需替换为你的参数)
    // ==========================================
    const firebaseConfig = {
      // 1. 去 console.firebase.google.com 创建一个免费项目
      // 2. 选择 Web App，将生成的 keys 填入下方
      apiKey: "",
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    function appData() {
      return {
        currentTab: 'itinerary',
        selectedDay: 0,
        syncMode: false,
        db: null,
        
        // 记账基础数据
        expenses: [],
        payers: ['昕', '爸', '妈', '胜', '锦'],
        categories: ['吃饭', '打车', '门票', '购物', '住宿', '大交通', '其他'],
        filterDate: 'all',
        form: {
          date: '2026-10-31', // 默认选中行程第一天
          category: '吃饭',
          payer: '昕',
          item: '',
          amount: ''
        },

        // 初始化
        init() {
          if (firebaseConfig.projectId && firebaseConfig.projectId !== "") {
            firebase.initializeApp(firebaseConfig);
            this.db = firebase.firestore();
            this.syncMode = true;
            // 实时监听云端数据 (别人添加的账单，你会瞬间看到)
            this.db.collection("trip_expenses").orderBy("createdAt", "desc").onSnapshot((querySnapshot) => {
              this.expenses = [];
              querySnapshot.forEach((doc) => {
                this.expenses.push({ id: doc.id, ...doc.data() });
              });
            });
          } else {
            // 单机离线模式 fallback
            this.syncMode = false;
            this.expenses = JSON.parse(localStorage.getItem('trip_expenses_local') || '[]');
          }
        },

        // 记账逻辑核心计算
        get uniqueDates() {
          const dates = [...new Set(this.expenses.map(e => e.date))];
          return dates.sort();
        },
        get filteredExpenses() {
          if (this.filterDate === 'all') return this.expenses;
          return this.expenses.filter(e => e.date === this.filterDate);
        },
        get totalAmount() {
          return this.filteredExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
        },
        get payerTotals() {
          let totals = {};
          this.payers.forEach(p => totals[p] = 0);
          this.filteredExpenses.forEach(e => {
            if(totals[e.payer] !== undefined) totals[e.payer] += parseFloat(e.amount || 0);
          });
          return totals;
        },
        get categoryTotals() {
          let totals = {};
          this.filteredExpenses.forEach(e => {
            totals[e.category] = (totals[e.category] || 0) + parseFloat(e.amount || 0);
          });
          return totals;
        },

        // 增删账目
        async addExpense() {
          if (!this.form.item || !this.form.amount) return alert("请填写花费明细与金额");
          
          const newExp = {
            ...this.form,
            amount: parseFloat(this.form.amount).toFixed(2),
            createdAt: new Date().getTime()
          };

          if (this.syncMode) {
            await this.db.collection("trip_expenses").add(newExp);
          } else {
            newExp.id = Date.now().toString();
            this.expenses.unshift(newExp);
            localStorage.setItem('trip_expenses_local', JSON.stringify(this.expenses));
          }
          this.form.item = '';
          this.form.amount = '';
        },
        
        async deleteExpense(id) {
          if(!confirm("确定要删除这笔账目吗？")) return;
          if (this.syncMode) {
            await this.db.collection("trip_expenses").doc(id).delete();
          } else {
            this.expenses = this.expenses.filter(e => e.id !== id);
            localStorage.setItem('trip_expenses_local', JSON.stringify(this.expenses));
          }
        },

        openBaiduMap(location) {
          window.location.href = 'baidumap://map/place/search?query=' + encodeURIComponent(location);
        },

        // 使用 Unsplash 无防盗链真实高清风景图
        itinerary: [
          {
            date: '10/31', title: 'Day 1: 上海初印象',
            items: [
              { time: '12:30-16:30', type: '景点', title: '豫园与城隍庙 (精华游)', desc: '400多年历史的江南明清园林，布局精巧以“小中见大”著称。', location: '上海豫园', 
                details: [{ 
                  title: '🗺️ 园内深度步行路线（约2.5小时）：', 
                  points: ['直奔镇园之宝【大假山】。', '走到【仰山堂】与【卷雨楼】，这是欣赏大假山和池景的最佳机位，拍倒影极美。', '进入【玉华堂】（园主书斋），堂前欣赏江南三大名石之一的【玉玲珑】。', '出园后，走上地标【九曲桥】，在湖心亭茶楼歇脚喝茶。'], 
                  images: [
                    'https://images.unsplash.com/photo-1549419131-017e813137cc?auto=format&fit=crop&w=400&q=80', // 古典建筑实景
                    'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=400&q=80'  // 小笼包实景
                  ]
                }]
              },
              { time: '17:30-21:30', type: '景点', title: '外滩保姆级夜游 (真实测算)', desc: '19:00-21:30是最佳打光蓝调时刻，对望陆家嘴三件套。', location: '外滩海关大楼', 
                details: [{ 
                  title: '📸 亲测无废步路线（全程2.5km / 步行40分）：', 
                  points: ['<b>1. 豫园站7号口 ➔ 海关大楼 (15分钟)</b>：外滩地标，准点听《东方红》钟声。', '<b>2. 海关大楼 ➔ 外滩观景台 (2分钟)</b>：正对黄浦江，全景解锁陆家嘴三件套。', '<b>3. 外滩观景台 ➔ 和平饭店 (5分钟)</b>：南京东路最美转角，老上海复古感。', '<b>4. 格林邮船 ➔ 外白渡桥 (5分钟)</b>：利用百年钢结构桥架进行框架构图。'], 
                  images: [
                    'https://images.unsplash.com/photo-1548248823-ce16bf249b32?auto=format&fit=crop&w=400&q=80', // 外滩天际线真实夜景
                    'https://images.unsplash.com/photo-1557053964-937650b63311?auto=format&fit=crop&w=400&q=80' // 外滩复古建筑街景
                  ]
                }]
              }
            ]
          },
          {
            date: '11/01', title: 'Day 2: 上海时空漫游',
            items: [
              { time: '14:30-17:00', type: '景点', title: '陆家嘴上海中心大厦', desc: '中国第一、世界第二高楼，上海无可争议的现代天际线核心。', location: '上海中心大厦', 
                details: [{ 
                  title: '🌆 登高与日落动线：', 
                  points: ['搭乘高速电梯直达118层，360度俯瞰黄浦江两岸，感受云端震撼。'],
                  images: ['https://images.unsplash.com/photo-1538428494232-9c0d8a3ab403?auto=format&fit=crop&w=400&q=80'] // 上海中心大厦与云端
                }]
              }
            ]
          },
          {
            date: '11/03', title: 'Day 4: 苏州水乡',
            items: [
              { time: '10:30-12:30', type: '景点', title: '拙政园与平江路', desc: '中国四大名园之一，世界文化遗产。', location: '苏州拙政园',
                details: [{ 
                  title: '🚶‍♂️ 园林与街区走法：', 
                  points: ['必须走到【小飞虹】，这是江南唯一的园林廊桥。', '进入平江路，找一家茶馆，5个人坐下来点壶茶，听一曲地道苏州评弹。'],
                  images: [
                    'https://images.unsplash.com/photo-1577801625902-691bf701d51a?auto=format&fit=crop&w=400&q=80', // 典型的苏式园林长廊实景
                    'https://images.unsplash.com/photo-1594951167448-f6ee4a8563a6?auto=format&fit=crop&w=400&q=80' // 江南水乡游船实景
                  ]
                }]
              }
            ]
          },
          {
            date: '11/04', title: 'Day 5: 苏州 ➔ 杭州',
            items: [
              { time: '14:00-17:30', type: '景点', title: '西湖水陆无痛游', desc: '避开暴走，用最舒服的方式看文人山水。', location: '杭州柳浪闻莺',
                details: [{ 
                  title: '🛶 水陆结合路线：', 
                  points: ['导航直达【柳浪闻莺】，在西湖边喝一杯【西湖龙井】。', '包下一条游船深入湖心，远观雷峰塔。'],
                  images: ['https://images.unsplash.com/photo-1576485077124-7740e53a9925?auto=format&fit=crop&w=400&q=80'] // 杭州西湖真实美景
                }]
              }
            ]
          }
        ]
      }
    }
  </script>
</body>
</html>
