<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>华东九日行｜随行卡片</title>

  <!-- Tailwind CSS & Alpine.js (含 Collapse 动画插件) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body { background-color: #f6f5f0; color: #2c2c2c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chinese-border { border: 1px solid #e2ded4; }
    .tag-must-visit { background-color: #e6f4ea; color: #137333; }
    .tag-must-eat { background-color: #fce8e6; color: #c5221f; }
    .tag-reservation { background-color: #fef7e0; color: #b06000; }
    .tag-buy { background-color: #f3e8fd; color: #7627bb; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-20">

  <div x-data="appData()" class="max-w-md mx-auto min-h-screen flex flex-col">
    
    <header class="bg-[#2d3a3a] text-[#e8e4d9] p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-widest">华东九日游</h1>
        <p class="text-xs text-gray-300">上海·无锡·苏州·乌镇·杭州</p>
      </div>
      <span class="text-xs border border-[#a39382] px-2 py-1 rounded text-[#e8e4d9]">5人商务包车</span>
    </header>

    <main class="flex-1 p-4">
      <div x-show="currentTab === 'itinerary'">
        
        <!-- 天数切换滑块 -->
        <div class="flex overflow-x-auto space-x-2 pb-3 mb-3 border-b border-gray-300 no-scrollbar">
          <template x-for="(day, index) in itinerary" :key="index">
            <button @click="selectedDay = index" 
                    :class="selectedDay === index ? 'bg-[#2d3a3a] text-white' : 'bg-white text-gray-700 chinese-border'"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all flex flex-col items-center">
              <span class="font-bold text-sm" x-text="'D' + (index + 1)"></span>
              <span class="text-[10px] opacity-80" x-text="day.date"></span>
            </button>
          </template>
        </div>

        <div class="bg-white rounded-xl p-3 mb-4 chinese-border shadow-sm flex justify-between items-center">
          <div>
            <h2 class="font-bold text-base text-[#2d3a3a]" x-text="itinerary[selectedDay].title"></h2>
            <p class="text-xs text-gray-500 mt-0.5" x-text="itinerary[selectedDay].route"></p>
          </div>
        </div>

        <!-- 动态行程卡片 -->
        <div class="space-y-4">
          <template x-for="item in itinerary[selectedDay].items" :key="item.time">
            
            <!-- 注入 x-data 用于控制单个卡片的折叠状态 -->
            <div x-data="{ expanded: false }" class="bg-white rounded-xl p-4 chinese-border shadow-sm">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded" x-text="item.time"></span>
                <span class="text-xs px-2 py-0.5 rounded font-medium" 
                      :class="item.type === '景点' ? 'bg-emerald-50 text-emerald-700' : (item.type === '餐饮' ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700')"
                      x-text="item.type"></span>
              </div>

              <h3 class="font-bold text-gray-800 text-lg mb-1" x-text="item.title"></h3>
              <p class="text-xs text-gray-600 mb-3 leading-relaxed" x-text="item.desc"></p>

              <!-- 彩色亮点标签 -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                <template x-for="highlight in item.highlights" :key="highlight.text">
                  <span class="text-[11px] px-2 py-0.5 rounded-full font-medium"
                        :class="getHighlightClass(highlight.type)"
                        x-text="highlight.type + ': ' + highlight.text"></span>
                </template>
              </div>

              <!-- 深度介绍下拉面板 (仅当有 details 时显示) -->
              <template x-if="item.details">
                <div class="mb-3">
                  <button @click="expanded = !expanded" class="w-full text-left flex justify-between items-center bg-gray-50 py-2 px-3 rounded-lg text-xs text-gray-700 font-medium active:bg-gray-100">
                    <span x-text="expanded ? '收起深度攻略' : '📍 查看景点图文与深度玩法'"></span>
                    <span x-text="expanded ? '▲' : '▼'" class="text-[10px] text-gray-400"></span>
                  </button>
                  
                  <div x-show="expanded" x-collapse class="mt-2 text-sm text-gray-700">
                    <template x-for="detail in item.details" :key="detail.title">
                      <div class="mb-4 mt-2">
                        <!-- 景点图片 -->
                        <template x-if="detail.image">
                          <img :src="detail.image" class="w-full h-40 object-cover rounded-lg mb-2 shadow-sm border border-gray-100" loading="lazy">
                        </template>
                        <!-- 景点细分玩法介绍 -->
                        <ul class="list-disc pl-4 space-y-1.5 text-xs text-gray-600">
                          <template x-for="point in detail.points" :key="point">
                            <li x-html="point" class="leading-relaxed"></li>
                          </template>
                        </ul>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- 百度地图打车/导航按钮 -->
              <template x-if="item.location">
                <div class="pt-3 border-t border-gray-100 flex justify-between items-center mt-2">
                  <span class="text-[11px] text-gray-400 truncate max-w-[180px] font-mono" x-text="'📍 ' + item.location"></span>
                  <a :href="'https://map.baidu.com/mobile/webapp/search/search/qt=s&wd=' + encodeURIComponent(item.location)" target="_blank"
                     class="text-xs text-[#2d3a3a] border border-[#2d3a3a] px-3 py-1.5 rounded flex items-center gap-1 active:bg-gray-100 font-medium transition-colors">
                    🧭 百度打车/导航
                  </a>
                </div>
              </template>
            </div>
            
          </template>
        </div>
      </div>

      <!-- 工具页面：物流与记账 (保持不变) -->
      <div x-show="currentTab === 'tools'" class="space-y-4">
        <!-- 航班信息 -->
        <div class="bg-white rounded-xl p-4 chinese-border">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-2 flex items-center gap-2">✈️ 航班与大交通</h2>
          <div class="text-xs space-y-2 text-gray-600">
            <p><b>去程：</b>10/31 01:05-03:30 降落浦东机场 (9座接机)</p>
            <p><b>回程：</b>11/8 02:15 起飞 (浦东机场T2航站楼送机)</p>
          </div>
        </div>
        
        <!-- 记账功能 -->
        <div class="bg-white rounded-xl p-4 chinese-border">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-2 flex items-center justify-between">
            <span>💰 离线随手记</span>
            <span class="text-xs text-emerald-700" x-text="'总计: ¥' + totalExpense"></span>
          </h2>
          <div class="flex gap-2 mb-3">
            <input type="text" x-model="newExpense.item" placeholder="项目(如:蟹粉小笼)" class="text-xs border rounded p-2 flex-1">
            <input type="number" x-model="newExpense.amount" placeholder="金额" class="text-xs border rounded p-2 w-20">
            <button @click="addExpense()" class="bg-[#2d3a3a] text-white px-3 py-2 rounded text-xs">记录</button>
          </div>
          <div class="max-h-60 overflow-y-auto space-y-1">
            <template x-for="(exp, i) in expenses" :key="i">
              <div class="flex justify-between text-xs py-1 border-b border-gray-100">
                <span x-text="exp.item" class="text-gray-700"></span>
                <div class="flex items-center gap-2">
                  <span x-text="'¥' + exp.amount" class="font-semibold text-gray-900"></span>
                  <button @click="deleteExpense(i)" class="text-red-400 text-[10px]">✕</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部 Tab 导航 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-1.5 z-50">
      <button @click="currentTab = 'itinerary'" :class="currentTab === 'itinerary' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-xl leading-none mb-0.5">📅</div>
        <div class="text-[10px] font-medium">每日行程</div>
      </button>
      <button @click="currentTab = 'tools'" :class="currentTab === 'tools' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-xl leading-none mb-0.5">🧰</div>
        <div class="text-[10px] font-medium">航班/记账</div>
      </button>
    </nav>

  </div>

  <script>
    function appData() {
      return {
        currentTab: 'itinerary',
        selectedDay: 0,
        expenses: JSON.parse(localStorage.getItem('trip_expenses') || '[]'),
        newExpense: { item: '', amount: '' },
        get totalExpense() { return this.expenses.reduce((sum, e) => sum + Number(e.amount), 0); },
        addExpense() {
          if (this.newExpense.item && this.newExpense.amount) {
            this.expenses.push({ ...this.newExpense });
            localStorage.setItem('trip_expenses', JSON.stringify(this.expenses));
            this.newExpense = { item: '', amount: '' };
          }
        },
        deleteExpense(index) {
          this.expenses.splice(index, 1);
          localStorage.setItem('trip_expenses', JSON.stringify(this.expenses));
        },
        getHighlightClass(type) {
          if (type === '必游') return 'tag-must-visit';
          if (type === '必吃' || type === '必点') return 'tag-must-eat';
          if (type === '预约' || type === '提醒') return 'tag-reservation';
          if (type === '必买') return 'tag-buy';
          return 'bg-gray-100 text-gray-600';
        },
        // 全量数据载入 (Day 1 - Day 9)
        itinerary: [
          {
            date: '10/31', title: 'Day 1: 上海初印象', route: '南京东路 ➔ 豫园 ➔ 外滩',
            items: [
              { time: '01:05-03:30', type: '交通', title: '机场接机与入住', desc: '提早预订的9座商务包车送达酒店，卸下5件大行李强制补眠。', location: '汉庭酒店(上海南京东路店)', highlights: [{type: '提醒', text: '深夜出行严格锚定时间'}] },
              { time: '10:00-12:30', type: '景点', title: '南京东路步行街', desc: '见证现代上海繁华变迁的最著名百年商业老街。', location: '上海南京东路步行街', highlights: [{type: '必吃', text: '青团/条头糕'}, {type: '必买', text: '沈大成老字号'}],
                details: [{ title: '打卡点', points: ['沿线历史悠久的四大公司建筑。', '打卡新世界大丸百货及各类旗舰店。'], image: 'https://image.pollinations.ai/prompt/shanghai_nanjing_road_pedestrian_street_daytime_bustling?width=600&height=300&nologo=true' }]
              },
              { time: '12:30-16:30', type: '景点', title: '豫园与城隍庙', desc: '拥有400多年历史的江南古典明清园林，以“小中见大”著称。', location: '上海豫园', highlights: [{type: '预约', text: '门票¥200'}, {type: '必点', text: '南翔蟹粉小笼包'}],
                details: [{ title: '深度游玩路线', points: ['<b>大假山</b>：豫园的镇园之宝，由数千吨武康石堆砌而成。', '<b>玉华堂</b>：园主的书斋，堂前欣赏江南三大名石之一“玉玲珑”。', '<b>点春堂</b>：曾是小刀会起义的指挥部，富有历史意义。', '<b>九曲桥与湖心亭</b>：走上地标九曲桥，寓意“弯弯曲曲结缘来”。'], image: 'https://image.pollinations.ai/prompt/yuyuan_garden_shanghai_traditional_chinese_architecture_lake_bridge?width=600&height=300&nologo=true' }]
              },
              { time: '17:30-21:30', type: '景点', title: '外滩滨江夜游', desc: '蓝调时刻氛围感拉满，对望陆家嘴三件套。', location: '外滩海关大楼', highlights: [{type: '必游', text: '万国建筑博览群'}],
                details: [{ title: '拍摄机位', points: ['海关大楼 ➔ 外滩观景台 ➔ 和平饭店 ➔ 格林邮船。', '外白渡桥与新天安堂：拍摄陆家嘴三件套的绝佳机位。'], image: 'https://image.pollinations.ai/prompt/the_bund_shanghai_night_view_historical_buildings_neon?width=600&height=300&nologo=true' }]
              }
            ]
          },
          {
            date: '11/01', title: 'Day 2: 上海时空漫游', route: '法租界 ➔ 上海中心 ➔ 北外滩',
            items: [
              { time: '09:00-12:30', type: '景点', title: '法租界武康路', desc: '保存最完好的历史风貌保护区，以法式老洋房著称。', location: '武康大楼', highlights: [{type: '必游', text: '武康大楼标志性船型'}, {type: '必吃', text: 'RAC Bar法式轻食'}],
                details: [{ title: '漫游路线', points: ['Teenie Weenie ➔ 宋庆龄故居 ➔ 武康大楼 ➔ 罗密欧阳台。', '沿武康路、安福路步行，感受买手店与咖啡文化。'], image: 'https://image.pollinations.ai/prompt/wukang_mansion_shanghai_historic_french_concession_architecture?width=600&height=300&nologo=true' }]
              },
              { time: '14:30-17:00', type: '景点', title: '陆家嘴上海中心大厦', desc: '中国第一、世界第二高楼，上海无可争议的现代天际线。', location: '上海中心大厦', highlights: [{type: '必游', text: '118层上海之巅'}, {type: '必点', text: '119层高空咖啡'}],
                details: [{ title: '高空体验', points: ['搭乘高速电梯直达118层，360度俯瞰黄浦江两岸，感受云端震撼。'], image: 'https://image.pollinations.ai/prompt/shanghai_tower_lujiazui_skyline_modern_skyscrapers?width=600&height=300&nologo=true' }]
              },
              { time: '17:30-21:30', type: '餐饮', title: '北外滩与老吉士晚宴', desc: '传统本帮菜晚餐，随后在巨型“魔都糖葫芦”机位拍摄对岸摩天大楼。', location: '老吉士(上海国金中心商场店)', highlights: [{type: '必点', text: '吉士红烧肉'}, {type: '必点', text: '葱烤鱼头'}],
                details: [{ title: '美食提示', points: ['晚餐建议在北外滩/陆家嘴就近用餐，避免跨江折返徐汇。', '饭后漫步至北外滩国客中心拍摄夜景。'], image: 'https://image.pollinations.ai/prompt/shanghai_braised_pork_belly_traditional_chinese_cuisine?width=600&height=300&nologo=true' }]
              }
            ]
          },
          {
            date: '11/02', title: 'Day 3: 无锡运河夜色', route: '惠山古镇 ➔ 寄畅园 ➔ 南长街',
            items: [
              { time: '08:30-10:30', type: '交通', title: '跨城前往无锡', desc: '乘坐7座商务包车，抵达酒店寄存5件大行李方可空手游览。', location: '无锡全季酒店(南长街店)', highlights: [{type: '提醒', text: '前台硬性物流寄存'}] },
              { time: '10:30-13:30', type: '餐饮', title: '午餐：王兴记', desc: '品尝无锡老字号面食。', location: '无锡王兴记', highlights: [{type: '必点', text: '无锡大红袍蟹粉小笼'}, {type: '必点', text: '三鲜馄饨'}] },
              { time: '14:00-16:30', type: '景点', title: '惠山古镇与寄畅园', desc: '京杭大运河畔历史名镇与江南古典园林杰作。', location: '无锡寄畅园', highlights: [{type: '必游', text: '寄畅园借景手法'}],
                details: [{ title: '古镇打卡', points: ['<b>寄畅园</b>：乾隆六下江南将其作为北京颐和园谐趣园的蓝本。体验精妙的“借景”手法，将锡山塔影借入园中。', '<b>惠山古镇路线</b>：西神广场 ➔ 祠堂群 ➔ 惠山寺。'], image: 'https://image.pollinations.ai/prompt/jichang_garden_wuxi_jiangnan_classical_garden_lake_pavilion?width=600&height=300&nologo=true' }]
              },
              { time: '17:30-20:30', type: '景点', title: '南长街与古运河夜色', desc: '典型的水弄堂江南水乡格局。', location: '无锡南长街', highlights: [{type: '必吃', text: '太湖三白、清蒸白鱼'}],
                details: [{ title: '运河夜游', points: ['跨越标志性的清名桥，赏两岸红灯笼亮起，感受千年古运河的静谧与烟火气。'], image: 'https://image.pollinations.ai/prompt/wuxi_ancient_canal_night_red_lanterns_water_town?width=600&height=300&nologo=true' }]
              }
            ]
          },
          {
            date: '11/03', title: 'Day 4: 苏州水乡', route: '拙政园 ➔ 平江路 ➔ 山塘街',
            items: [
              { time: '09:00-10:00', type: '交通', title: '包车转移苏州', desc: '带齐行李退房，商务包车直达苏州酒店，寄存大行李。', location: '安逸酒店(苏州观前街平江路店)', highlights: [] },
              { time: '10:30-12:30', type: '景点', title: '拙政园与狮子林', desc: '中国四大名园之一，世界文化遗产。', location: '苏州拙政园', highlights: [{type: '预约', text: '提前14天小程序预订'}, {type: '必游', text: '小飞虹廊桥'}],
                details: [{ title: '园林赏析', points: ['<b>拙政园</b>：以“水”为中心的园林布局，走过江南唯一的廊桥“小飞虹”。', '<b>狮子林</b>：体会一步一景的假山造园艺术。'], image: 'https://image.pollinations.ai/prompt/humble_administrator_garden_suzhou_bridge_lotus_pond?width=600&height=300&nologo=true' }]
              },
              { time: '12:30-17:00', type: '景点', title: '平江路历史街区', desc: '完美呈现宋代《平江图》“水陆并行”格局。午餐在松鹤楼。', location: '苏州平江路', highlights: [{type: '必游', text: '听地道苏州评弹'}, {type: '必吃', text: '松鹤楼本帮菜'}],
                details: [{ title: '文化体验', points: ['漫步小桥流水人家的弄堂间。', '安排5人进入茶馆，听一曲地道吴侬软语的苏州评弹，喝茶吃糕点。'], image: 'https://image.pollinations.ai/prompt/suzhou_pingjiang_road_water_town_canal_boats?width=600&height=300&nologo=true' }]
              },
              { time: '17:30-20:00', type: '景点', title: '七里山塘街夜游', desc: '被誉为“姑苏第一名街”，白居易任刺史时所建。', location: '苏州七里山塘景区', highlights: [{type: '必吃', text: '苏式焖肉面/爆鱼面'}],
                details: [{ title: '夜游亮点', points: ['沿河观赏粉墙黛瓦，体验一次短途山塘摇橹船，换个水上视角看水乡夜色。'], image: 'https://image.pollinations.ai/prompt/shantang_street_suzhou_night_red_lanterns_canal?width=600&height=300&nologo=true' }]
              }
            ]
          },
          {
            date: '11/04', title: 'Day 5: 苏州 ➔ 杭州', route: '西湖水陆游 ➔ 南山路夜景',
            items: [
