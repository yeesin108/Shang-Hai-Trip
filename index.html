<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>华东九日行｜随行卡与云记账</title>

  <!-- Tailwind CSS & Alpine.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Firebase SDK (支持多人云端同步) -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #f6f5f0; color: #2c2c2c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chinese-border { border: 1px solid #e2ded4; }
    .tag-must-visit { background-color: #e6f4ea; color: #137333; }
    .tag-must-eat { background-color: #fce8e6; color: #c5221f; }
    .tag-reservation { background-color: #fef7e0; color: #b06000; }
    .tag-buy { background-color: #f3e8fd; color: #7627bb; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24">

  <div x-data="appData()" class="max-w-md mx-auto min-h-screen flex flex-col">
    
    <header class="bg-[#2d3a3a] text-[#e8e4d9] p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-widest">华东九日游</h1>
        <p class="text-[11px] text-gray-300">上海·无锡·苏州·乌镇·杭州</p>
      </div>
      <div class="text-right">
        <span class="text-[10px] border border-[#a39382] px-2 py-0.5 rounded text-[#e8e4d9]">5人包车团</span>
        <div x-show="syncMode" class="text-[9px] text-emerald-400 mt-1">🟢 多人云端同步中</div>
        <div x-show="!syncMode" class="text-[9px] text-orange-300 mt-1">🟡 单机离线模式</div>
      </div>
    </header>

    <main class="flex-1 p-4">
      
      <!-- ================= 模块一：每日行程 (全量恢复 Day 1 至 Day 9) ================= -->
      <div x-show="currentTab === 'itinerary'">
        
        <div class="flex overflow-x-auto space-x-2 pb-3 mb-3 border-b border-gray-300 no-scrollbar">
          <template x-for="(day, index) in itinerary" :key="index">
            <button @click="selectedDay = index" 
                    :class="selectedDay === index ? 'bg-[#2d3a3a] text-white' : 'bg-white text-gray-700 chinese-border'"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all flex flex-col items-center">
              <span class="font-bold text-sm" x-text="'D' + (index + 1)"></span>
              <span class="text-[10px] opacity-80" x-text="day.date"></span>
            </button>
          </template>
        </div>

        <div class="bg-white rounded-xl p-3 mb-4 chinese-border shadow-sm">
          <h2 class="font-bold text-base text-[#2d3a3a]" x-text="itinerary[selectedDay].title"></h2>
          <p class="text-[11px] text-gray-500 mt-0.5" x-text="'动线：' + itinerary[selectedDay].route"></p>
        </div>

        <div class="space-y-4">
          <template x-for="item in itinerary[selectedDay].items" :key="item.time">
            <div x-data="{ expanded: false }" class="bg-white rounded-xl p-4 chinese-border shadow-sm">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded" x-text="item.time"></span>
                <span class="text-[11px] px-2 py-0.5 rounded font-medium" 
                      :class="item.type === '景点' ? 'bg-emerald-50 text-emerald-700' : (item.type === '餐饮' ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700')"
                      x-text="item.type"></span>
              </div>

              <h3 class="font-bold text-gray-800 text-base mb-1" x-text="item.title"></h3>
              <p class="text-xs text-gray-600 mb-3 leading-relaxed" x-text="item.desc"></p>

              <!-- 亮点标签 -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                <template x-for="highlight in item.highlights" :key="highlight.text">
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-medium"
                        :class="getHighlightClass(highlight.type)"
                        x-text="highlight.type + ': ' + highlight.text"></span>
                </template>
              </div>

              <!-- 深度攻略下拉面板与真实照片墙 -->
              <template x-if="item.details">
                <div class="mb-3">
                  <button @click="expanded = !expanded" class="w-full text-left flex justify-between items-center bg-gray-50 py-2.5 px-3 rounded-lg text-[11px] text-[#2d3a3a] font-bold active:bg-gray-100 border border-gray-100">
                    <span x-text="expanded ? '收起保姆级攻略' : '📖 展开实测步行攻略与实景'"></span>
                    <span x-text="expanded ? '▲' : '▼'" class="text-[10px] text-gray-400"></span>
                  </button>
                  
                  <div x-show="expanded" x-collapse class="mt-3">
                    <template x-for="detail in item.details" :key="detail.title">
                      <div class="mb-5">
                        <h4 class="text-[11px] font-bold text-gray-800 mb-2 border-l-2 border-[#2d3a3a] pl-2" x-text="detail.title"></h4>
                        <ul class="space-y-2 text-[11px] text-gray-600 mb-3 pl-1">
                          <template x-for="point in detail.points" :key="point">
                            <li x-html="point" class="leading-relaxed bg-gray-50 p-2 rounded"></li>
                          </template>
                        </ul>
                        <template x-if="detail.images && detail.images.length > 0">
                          <div class="flex overflow-x-auto snap-x snap-mandatory space-x-3 pb-2 no-scrollbar">
                            <template x-for="img in detail.images" :key="img">
                              <div class="snap-center shrink-0">
                                <img :src="img" class="w-40 h-52 object-cover rounded-lg shadow-sm border border-gray-200" loading="lazy">
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- 百度地图唤醒按钮 -->
              <template x-if="item.location">
                <div class="pt-3 border-t border-gray-100 flex justify-between items-center mt-2">
                  <span class="text-[10px] text-gray-400 truncate max-w-[160px] font-mono" x-text="'📍 ' + item.location"></span>
                  <button @click="openBaiduMap(item.location)" class="text-[11px] text-white bg-[#2942ff] px-3 py-1.5 rounded-full flex items-center gap-1 active:bg-blue-700 font-medium transition-colors shadow-sm">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    唤起百度地图
                  </button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- ================= 模块二：多人云端记账功能 ================= -->
      <div x-show="currentTab === 'accounting'" class="space-y-4">
        
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-3 flex items-center justify-between">
            <span>✍️ 记一笔账</span>
          </h2>
          <div class="space-y-3">
            <div class="flex gap-2">
              <input type="date" x-model="form.date" class="text-xs border border-gray-300 rounded p-2 flex-1 bg-gray-50">
              <select x-model="form.category" class="text-xs border border-gray-300 rounded p-2 flex-1 bg-gray-50 text-[#2d3a3a] font-bold">
                <template x-for="cat in categories" :key="cat"><option :value="cat" x-text="cat"></option></template>
              </select>
            </div>
            <div class="flex gap-2">
              <select x-model="form.payer" class="text-xs border border-gray-300 rounded p-2 w-24 bg-gray-50 text-orange-600 font-bold">
                <template x-for="p in payers" :key="p"><option :value="p" x-text="p + ' 支付'"></option></template>
              </select>
              <input type="text" x-model="form.item" placeholder="明细 (如: 松鹤楼午餐)" class="text-xs border border-gray-300 rounded p-2 flex-1">
            </div>
            <div class="flex gap-2 items-center">
              <span class="font-bold text-gray-600">¥</span>
              <input type="number" x-model="form.amount" placeholder="0.00" class="text-sm border border-gray-300 rounded p-2 flex-1 font-mono">
              <button @click="addExpense()" class="bg-[#2d3a3a] text-white px-5 py-2 rounded text-xs font-bold active:bg-gray-800">记账</button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <div class="flex justify-between items-end border-b pb-3 mb-3">
            <div>
              <span class="text-[10px] text-gray-500 block mb-1" x-text="filterDate === 'all' ? '旅行总计花费 (¥)' : filterDate + ' 单日花费 (¥)'"></span>
              <span class="text-2xl font-bold text-[#2d3a3a] font-mono" x-text="totalAmount.toFixed(2)"></span>
            </div>
            <select x-model="filterDate" class="text-[10px] border border-gray-300 rounded px-2 py-1.5 bg-gray-50 font-bold text-[#2d3a3a]">
              <option value="all">📅 筛选: 全部日期</option>
              <template x-for="d in uniqueDates" :key="d"><option :value="d" x-text="'📅 ' + d"></option></template>
            </select>
          </div>

          <!-- 谁支付了多少看板 -->
          <div class="mb-4">
            <span class="text-[10px] text-gray-500 block mb-2 font-bold">个人支付汇总 (当前筛选)</span>
            <div class="flex flex-wrap gap-2">
              <template x-for="(amt, payer) in payerTotals" :key="payer">
                <div class="bg-orange-50 border border-orange-100 px-2 py-1.5 rounded-md flex-1 min-w-[50px] text-center">
                  <div class="text-[10px] text-gray-600" x-text="payer"></div>
                  <div class="text-[11px] font-bold text-orange-700" x-text="'¥' + amt"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- 花费分类占比看板 -->
          <div>
            <span class="text-[10px] text-gray-500 block mb-2 font-bold">按分类汇总 (当前筛选)</span>
            <div class="space-y-1.5">
              <template x-for="(amt, cat) in categoryTotals" :key="cat">
                <div class="flex justify-between items-center text-[11px] bg-gray-50 px-2 py-1.5 rounded">
                  <span class="text-gray-600 font-medium" x-text="cat"></span>
                  <span class="font-mono font-bold text-gray-800" x-text="'¥' + amt"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- 账单明细流水 -->
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-3 text-xs">账目流水明细</h2>
          <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
            <template x-for="exp in filteredExpenses" :key="exp.id">
              <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <div>
                  <div class="flex items-center gap-1.5 mb-0.5">
                    <span class="text-[9px] bg-emerald-50 text-emerald-700 border border-emerald-100 px-1 rounded" x-text="exp.category"></span>
                    <span class="text-[11px] font-bold text-gray-800" x-text="exp.item"></span>
                  </div>
                  <div class="text-[9px] text-gray-400" x-text="exp.date + ' | ' + exp.payer + ' 支付'"></div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-sm font-bold font-mono text-[#2d3a3a]" x-text="'¥' + parseFloat(exp.amount).toFixed(2)"></span>
                  <button @click="deleteExpense(exp.id)" class="text-red-400 text-[10px] px-1.5 py-1 border border-red-100 rounded bg-red-50">删</button>
                </div>
              </div>
            </template>
            <div x-show="filteredExpenses.length === 0" class="text-center text-[10px] text-gray-400 py-4">该日期暂无记录</div>
          </div>
        </div>
      </div>

    </main>

    <!-- 底部 Tab -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-50">
      <button @click="currentTab = 'itinerary'" :class="currentTab === 'itinerary' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-lg leading-none mb-1">📅</div>
        <div class="text-[10px] font-bold">每日打卡</div>
      </button>
      <button @click="currentTab = 'accounting'" :class="currentTab === 'accounting' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-lg leading-none mb-1">💰</div>
        <div class="text-[10px] font-bold">5人记账</div>
      </button>
    </nav>
  </div>

  <script>
    // ==========================================
    // ⚠️ Firebase 多人同步数据库配置区 
    // (去 console.firebase.google.com 创建一个免费 Web App 填入配置即可)
    // ==========================================
    const firebaseConfig = {
      apiKey: "",
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    function appData() {
      return {
        currentTab: 'itinerary',
        selectedDay: 0,
        syncMode: false,
        db: null,
        
        expenses: [],
        // 完全匹配：五位成员
        payers: ['爸', '妈', '胜', '锦', '昕'],
        // 完全匹配：消费分类
        categories: ['门票', '打车', '吃饭', '购物', '住宿', '大交通', '其他'],
        filterDate: 'all',
        form: {
          date: '2026-10-31', 
          category: '吃饭',
          payer: '昕', // 默认选中昕
          item: '',
          amount: ''
        },

        init() {
          if (firebaseConfig.projectId && firebaseConfig.projectId !== "") {
            firebase.initializeApp(firebaseConfig);
            this.db = firebase.firestore();
            this.syncMode = true;
            this.db.collection("trip_expenses").orderBy("createdAt", "desc").onSnapshot((querySnapshot) => {
              this.expenses = [];
              querySnapshot.forEach((doc) => {
                this.expenses.push({ id: doc.id, ...doc.data() });
              });
            });
          } else {
            this.syncMode = false;
            this.expenses = JSON.parse(localStorage.getItem('trip_expenses_local') || '[]');
          }
        },

        get uniqueDates() {
          const dates = [...new Set(this.expenses.map(e => e.date))];
          return dates.sort();
        },
        get filteredExpenses() {
          if (this.filterDate === 'all') return this.expenses;
          return this.expenses.filter(e => e.date === this.filterDate);
        },
        get totalAmount() {
          return this.filteredExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
        },
        get payerTotals() {
          let totals = {};
          this.payers.forEach(p => totals[p] = 0);
          this.filteredExpenses.forEach(e => {
            if(totals[e.payer] !== undefined) totals[e.payer] += parseFloat(e.amount || 0);
          });
          // 只过滤出有金额的显示，保持界面清爽，不用的名字值为 0
          return totals;
        },
        get categoryTotals() {
          let totals = {};
          this.filteredExpenses.forEach(e => {
            totals[e.category] = (totals[e.category] || 0) + parseFloat(e.amount || 0);
          });
          return totals;
        },

        async addExpense() {
          if (!this.form.item || !this.form.amount) return alert("请填写花费明细与金额");
          const newExp = {
            ...this.form,
            amount: parseFloat(this.form.amount).toFixed(2),
            createdAt: new Date().getTime()
          };

          if (this.syncMode) {
            await this.db.collection("trip_expenses").add(newExp);
          } else {
            newExp.id = Date.now().toString();
            this.expenses.unshift(newExp);
            localStorage.setItem('trip_expenses_local', JSON.stringify(this.expenses));
          }
          this.form.item = '';
          this.form.amount = '';
        },
        
        async deleteExpense(id) {
          if(!confirm("确定要删除这笔账目吗？")) return;
          if (this.syncMode) {
            await this.db.collection("trip_expenses").doc(id).delete();
          } else {
            this.expenses = this.expenses.filter(e => e.id !== id);
            localStorage.setItem('trip_expenses_local', JSON.stringify(this.expenses));
          }
        },

        openBaiduMap(location) {
          window.location.href = 'baidumap://map/place/search?query=' + encodeURIComponent(location);
        },

        getHighlightClass(type) {
          if (type === '必游') return 'tag-must-visit';
          if (type === '必吃' || type === '必点') return 'tag-must-eat';
          if (type === '预约' || type === '提醒' || type === '硬性') return 'tag-reservation';
          if (type === '必买') return 'tag-buy';
          return 'bg-gray-100 text-gray-600';
        },
        
        // 全量数据恢复 (Day 1 到 Day 9)，全部替换为无防盗链真实照片 (Unsplash API)
        itinerary: [
          {
            date: '10/31', title: 'Day 1: 上海初印象', route: '南京东路 ➔ 豫园 ➔ 外滩夜游',
            items: [
              { time: '10:00-12:30', type: '景点', title: '南京东路步行街', desc: '见证现代上海繁华变迁的商业老街。', location: '上海南京东路步行街', highlights: [{type: '必吃', text: '青团/条头糕'}, {type: '必买', text: '沈大成'}],
                details: [{ 
                  title: '🚶‍♀️ 游玩动线怎么走：', 
                  points: ['<b>起点：</b>从汉庭酒店步行出发。', '<b>中途：</b>沿街打卡历史悠久的四大公司建筑。', '<b>终点：</b>纵穿街区抵达新世界大丸百货及各类旗舰店。'], 
                  images: ['https://images.unsplash.com/photo-1549488344-c28f6236b328?auto=format&fit=crop&w=400&q=80', 'https://images.unsplash.com/photo-1577732958349-f0270a417dd1?auto=format&fit=crop&w=400&q=80']
                }]
              },
              { time: '12:30-16:30', type: '景点', title: '豫园与城隍庙 (精华游)', desc: '400多年历史的江南明清园林，布局精巧以“小中见大”著称。', location: '上海豫园', highlights: [{type: '预约', text: '门票¥200'}, {type: '必点', text: '南翔蟹粉小笼包'}],
                details: [{ 
                  title: '🗺️ 园内深度步行路线（约2.5小时）：', 
                  points: [
                    '<b>第一步：</b>直奔镇园之宝【大假山】，数千吨武康石堆砌而成。', 
                    '<b>第二步：</b>走到【仰山堂】与【卷雨楼】，这里是欣赏大假山和池景的最佳机位，拍倒影极美。', 
                    '<b>第三步：</b>进入【玉华堂】（园主书斋），堂前欣赏江南三大名石【玉玲珑】。', 
                    '<b>第四步：</b>穿过小刀会遗址【点春堂】。出园后走上地标【九曲桥】，在湖心亭茶楼歇脚喝茶。'
                  ], 
                  images: ['https://images.unsplash.com/photo-1549419131-017e813137cc?auto=format&fit=crop&w=400&q=80', 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=400&q=80']
                }]
              },
              { time: '17:30-21:30', type: '景点', title: '外滩保姆级夜游 (真实测算)', desc: '19:00-21:30是最佳打光蓝调时刻，对望陆家嘴三件套。', location: '外滩海关大楼', highlights: [{type: '必游', text: '万国建筑博览群'}],
                details: [{ 
                  title: '📸 亲测无废步路线（全程2.5km / 步行40分）：', 
                  points: [
                    '<b>1. 豫园地铁站 ➔ 海关大楼 (15分钟)</b>：外滩地标，准点听《东方红》钟声。',
                    '<b>2. 海关大楼 ➔ 外滩观景台 (2分钟)</b>：正对黄浦江，全景解锁陆家嘴三件套。',
                    '<b>3. 观景台 ➔ 和平饭店 (5分钟)</b>：南京东路最美转角。',
                    '<b>4. 和平饭店 ➔ 格林邮船 (4分钟)</b>：仰拍东方明珠的宝藏角度。',
                    '<b>5. 格林邮船 ➔ 外白渡桥 (5分钟)</b>：利用百年钢结构桥架进行框架构图。最后顺路走南京路回酒店。'
                  ], 
                  images: ['https://images.unsplash.com/photo-1548248823-ce16bf249b32?auto=format&fit=crop&w=400&q=80', 'https://images.unsplash.com/photo-1557053964-937650b63311?auto=format&fit=crop&w=400&q=80']
                }]
              }
            ]
