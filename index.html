<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>华东九日行｜保姆级随行卡</title>

  <!-- Tailwind CSS & Alpine.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body { background-color: #f6f5f0; color: #2c2c2c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chinese-border { border: 1px solid #e2ded4; }
    .tag-must-visit { background-color: #e6f4ea; color: #137333; }
    .tag-must-eat { background-color: #fce8e6; color: #c5221f; }
    .tag-reservation { background-color: #fef7e0; color: #b06000; }
    .tag-buy { background-color: #f3e8fd; color: #7627bb; }
    /* 隐藏滚动条但保留横向滚动功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-20">

  <div x-data="appData()" class="max-w-md mx-auto min-h-screen flex flex-col">
    
    <header class="bg-[#2d3a3a] text-[#e8e4d9] p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-widest">华东九日游</h1>
        <p class="text-xs text-gray-300">上海·无锡·苏州·乌镇·杭州</p>
      </div>
      <span class="text-[10px] border border-[#a39382] px-2 py-1 rounded text-[#e8e4d9]">5人商务包车</span>
    </header>

    <main class="flex-1 p-4">
      <!-- TAB: 每日行程 -->
      <div x-show="currentTab === 'itinerary'">
        
        <!-- 天数滑块 -->
        <div class="flex overflow-x-auto space-x-2 pb-3 mb-3 border-b border-gray-300 no-scrollbar">
          <template x-for="(day, index) in itinerary" :key="index">
            <button @click="selectedDay = index" 
                    :class="selectedDay === index ? 'bg-[#2d3a3a] text-white' : 'bg-white text-gray-700 chinese-border'"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all flex flex-col items-center">
              <span class="font-bold text-sm" x-text="'D' + (index + 1)"></span>
              <span class="text-[10px] opacity-80" x-text="day.date"></span>
            </button>
          </template>
        </div>

        <div class="bg-white rounded-xl p-3 mb-4 chinese-border shadow-sm">
          <h2 class="font-bold text-base text-[#2d3a3a]" x-text="itinerary[selectedDay].title"></h2>
          <p class="text-[11px] text-gray-500 mt-0.5" x-text="'动线：' + itinerary[selectedDay].route"></p>
        </div>

        <!-- 行程卡片 -->
        <div class="space-y-4">
          <template x-for="item in itinerary[selectedDay].items" :key="item.time">
            
            <div x-data="{ expanded: false }" class="bg-white rounded-xl p-4 chinese-border shadow-sm">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded" x-text="item.time"></span>
                <span class="text-[11px] px-2 py-0.5 rounded font-medium" 
                      :class="item.type === '景点' ? 'bg-emerald-50 text-emerald-700' : (item.type === '餐饮' ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700')"
                      x-text="item.type"></span>
              </div>

              <h3 class="font-bold text-gray-800 text-base mb-1" x-text="item.title"></h3>
              <p class="text-xs text-gray-600 mb-3 leading-relaxed" x-text="item.desc"></p>

              <!-- 亮点标签 -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                <template x-for="highlight in item.highlights" :key="highlight.text">
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-medium"
                        :class="getHighlightClass(highlight.type)"
                        x-text="highlight.type + ': ' + highlight.text"></span>
                </template>
              </div>

              <!-- 深度攻略下拉面板 (小红书风) -->
              <template x-if="item.details">
                <div class="mb-3">
                  <button @click="expanded = !expanded" class="w-full text-left flex justify-between items-center bg-gray-50 py-2.5 px-3 rounded-lg text-[11px] text-[#2d3a3a] font-bold active:bg-gray-100 border border-gray-100">
                    <span x-text="expanded ? '收起保姆级攻略' : '📖 展开小红书同款保姆级攻略与图集'"></span>
                    <span x-text="expanded ? '▲' : '▼'" class="text-[10px] text-gray-400"></span>
                  </button>
                  
                  <div x-show="expanded" x-collapse class="mt-3">
                    <template x-for="detail in item.details" :key="detail.title">
                      <div class="mb-5">
                        
                        <!-- 核心游玩路线/介绍 -->
                        <h4 class="text-[11px] font-bold text-gray-800 mb-2 border-l-2 border-[#2d3a3a] pl-2" x-text="detail.title"></h4>
                        <ul class="space-y-2 text-[11px] text-gray-600 mb-3 pl-1">
                          <template x-for="point in detail.points" :key="point">
                            <li x-html="point" class="leading-relaxed bg-gray-50 p-2 rounded"></li>
                          </template>
                        </ul>

                        <!-- 横向滑动照片墙 (3:4比例) -->
                        <template x-if="detail.images && detail.images.length > 0">
                          <div class="flex overflow-x-auto snap-x snap-mandatory space-x-3 pb-2 no-scrollbar">
                            <template x-for="img in detail.images" :key="img">
                              <div class="snap-center shrink-0">
                                <!-- 模仿小红书 3:4 (w-40 h-52) 的竖版构图 -->
                                <img :src="img" class="w-40 h-52 object-cover rounded-lg shadow-sm border border-gray-200" loading="lazy">
                              </div>
                            </template>
                          </div>
                        </template>

                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- 百度地图唤醒按钮 -->
              <template x-if="item.location">
                <div class="pt-3 border-t border-gray-100 flex justify-between items-center mt-2">
                  <span class="text-[10px] text-gray-400 truncate max-w-[160px] font-mono" x-text="'📍 ' + item.location"></span>
                  <!-- 点击直接调用 baidumap:// 原生协议 -->
                  <button @click="openBaiduMap(item.location)"
                     class="text-[11px] text-white bg-[#2942ff] px-3 py-1.5 rounded-full flex items-center gap-1 active:bg-blue-700 font-medium transition-colors shadow-sm">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    唤起百度地图
                  </button>
                </div>
              </template>
            </div>
            
          </template>
        </div>
      </div>

      <!-- 工具页面 -->
      <div x-show="currentTab === 'tools'" class="space-y-4">
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-2 flex items-center gap-2">✈️ 航班大交通</h2>
          <div class="text-[11px] space-y-2 text-gray-600">
            <p><b>去程：</b>10/31 01:05-03:30 降落浦东机场 (9座接机)</p>
            <p><b>回程：</b>11/8 02:15 起飞 (浦东机场T2航站楼送机)</p>
          </div>
        </div>
        
        <div class="bg-white rounded-xl p-4 chinese-border shadow-sm">
          <h2 class="font-bold text-gray-800 border-b pb-2 mb-2 flex items-center justify-between">
            <span>💰 离线随手记账</span>
            <span class="text-xs text-emerald-700" x-text="'总计: ¥' + totalExpense"></span>
          </h2>
          <div class="flex gap-2 mb-3">
            <input type="text" x-model="newExpense.item" placeholder="输入账目" class="text-xs border rounded p-2 flex-1">
            <input type="number" x-model="newExpense.amount" placeholder="金额¥" class="text-xs border rounded p-2 w-20">
            <button @click="addExpense()" class="bg-[#2d3a3a] text-white px-3 py-2 rounded text-xs">记录</button>
          </div>
          <div class="max-h-60 overflow-y-auto space-y-1">
            <template x-for="(exp, i) in expenses" :key="i">
              <div class="flex justify-between text-[11px] py-1 border-b border-gray-100">
                <span x-text="exp.item" class="text-gray-700"></span>
                <div class="flex items-center gap-2">
                  <span x-text="'¥' + exp.amount" class="font-semibold text-gray-900"></span>
                  <button @click="deleteExpense(i)" class="text-red-400 font-bold">✕</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部 Tab -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-50">
      <button @click="currentTab = 'itinerary'" :class="currentTab === 'itinerary' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-lg leading-none mb-1">📅</div>
        <div class="text-[10px] font-bold">每日打卡</div>
      </button>
      <button @click="currentTab = 'tools'" :class="currentTab === 'tools' ? 'text-[#2d3a3a]' : 'text-gray-400'" class="text-center flex-1">
        <div class="text-lg leading-none mb-1">🧰</div>
        <div class="text-[10px] font-bold">记账/航班</div>
      </button>
    </nav>

  </div>

  <script>
    function appData() {
      return {
        currentTab: 'itinerary',
        selectedDay: 0,
        expenses: JSON.parse(localStorage.getItem('trip_expenses') || '[]'),
        newExpense: { item: '', amount: '' },
        get totalExpense() { return this.expenses.reduce((sum, e) => sum + Number(e.amount), 0); },
        addExpense() {
          if (this.newExpense.item && this.newExpense.amount) {
            this.expenses.push({ ...this.newExpense });
            localStorage.setItem('trip_expenses', JSON.stringify(this.expenses));
            this.newExpense = { item: '', amount: '' };
          }
        },
        deleteExpense(index) {
          this.expenses.splice(index, 1);
          localStorage.setItem('trip_expenses', JSON.stringify(this.expenses));
        },
        // 核心原生 App 唤醒函数
        openBaiduMap(location) {
          // 直接使用 baidumap:// 协议唤起手机本地 App
          const scheme = 'baidumap://map/place/search?query=' + encodeURIComponent(location);
          window.location.href = scheme;
        },
        getHighlightClass(type) {
          if (type === '必游') return 'tag-must-visit';
          if (type === '必吃' || type === '必点') return 'tag-must-eat';
          if (type === '预约' || type === '提醒' || type === '硬性') return 'tag-reservation';
          if (type === '必买') return 'tag-buy';
          return 'bg-gray-100 text-gray-600';
        },
        
        // 全量数据与长篇深度攻略
        itinerary: [
          {
            date: '10/31', title: 'Day 1: 上海初印象', route: '南京东路 ➔ 豫园 ➔ 外滩夜游',
            items: [
              { time: '10:00-12:30', type: '景点', title: '南京东路步行街', desc: '见证现代上海繁华变迁的商业老街，吃老字号糕点。', location: '上海南京东路步行街', highlights: [{type: '必吃', text: '青团/条头糕'}, {type: '必买', text: '沈大成'}],
                details: [{ 
                  title: '🚶‍♀️ 游玩动线怎么走：', 
                  points: ['<b>起点：</b>从汉庭酒店步行出发，到达步行街起点。', '<b>中途：</b>沿街打卡历史悠久的四大公司建筑（先施、永安、新新、大新）。', '<b>终点：</b>纵穿街区抵达新世界大丸百货及各类旗舰店。'], 
                  images: [
                    'https://image.pollinations.ai/prompt/xiaohongshu_travel_photography_shanghai_nanjing_road_neon_signs_pedestrians_portrait_aspect_ratio_realistic?width=400&height=520&nologo=true',
                    'https://image.pollinations.ai/prompt/xiaohongshu_style_shanghai_traditional_pastry_qingtuan_food_photography_aesthetic?width=400&height=520&nologo=true'
                  ]
                }]
              },
              { time: '12:30-16:30', type: '景点', title: '豫园与城隍庙 (精华游)', desc: '400多年历史的江南明清园林，布局精巧以“小中见大”著称。', location: '上海豫园', highlights: [{type: '预约', text: '门票¥200'}, {type: '必点', text: '南翔蟹粉小笼包'}],
                details: [{ 
                  title: '🗺️ 园内深度步行路线（约2.5小时）：', 
                  points: [
                    '<b>第一步：</b>开园即入。直奔镇园之宝【大假山】，由数千吨武康石堆砌而成，气势极盛。', 
                    '<b>第二步：</b>走到【仰山堂】与【卷雨楼】，这里是欣赏大假山和池景的最佳机位，拍倒影极美。', 
                    '<b>第三步：</b>进入【玉华堂】（园主书斋），堂前欣赏江南三大名石之一的【玉玲珑】。', 
                    '<b>第四步：</b>穿过小刀会起义遗址【点春堂】。',
                    '<b>第五步：</b>出园后，走上地标【九曲桥】，寓意“弯弯曲曲结缘来”。在湖心亭茶楼歇脚喝茶。',
                    '<b>第六步（城隍庙）：</b>步行至城隍庙（约逛30分钟），感受香火缭绕的道教建筑。'
                  ], 
                  images: [
                    'https://image.pollinations.ai/prompt/xiaohongshu_photography_yuyuan_garden_shanghai_jiuqu_bridge_pavilion_lake_portrait?width=400&height=520&nologo=true',
                    'https://image.pollinations.ai/prompt/xiaohongshu_food_shanghai_xiaolongbao_bamboo_steamer_close_up?width=400&height=520&nologo=true',
                    'https://image.pollinations.ai/prompt/xiaohongshu_travel_chenghuangmiao_temple_shanghai_incense_smoke_red_walls?width=400&height=520&nologo=true'
                  ]
                }]
              },
              { time: '17:30-21:30', type: '景点', title: '外滩保姆级夜游 (真实测算)', desc: '19:00-21:30是最佳打光蓝调时刻，对望陆家嘴三件套。', location: '外滩海关大楼', highlights: [{type: '必游', text: '万国建筑博览群'}],
                details: [{ 
                  title: '📸 亲测无废步路线（全程2.5km / 步行40分）：', 
                  points: [
                    '<b>1. 豫园地铁站7号口 ➔ 海关大楼 (980m | 15分钟)</b>：外滩地标，准点听《东方红》钟声，出片必拍。',
                    '<b>2. 海关大楼 ➔ 外滩观景台 (90m | 2分钟)</b>：正对黄浦江，全景解锁陆家嘴三件套，视觉拉满。',
                    '<b>3. 外滩观景台 ➔ 和平饭店 (279m | 5分钟)</b>：南京东路最美转角，老上海复古高级感。',
                    '<b>4. 和平饭店 ➔ 格林邮船 (281m | 4分钟)</b>：仰拍东方明珠的宝藏角度，建筑线条极强。',
                    '<b>5. 格林邮船 ➔ 外白渡桥 (273m | 5分钟)</b>：利用百年钢结构桥架进行框架构图。',
                    '<b>6. 外白渡桥 ➔ 新天安堂 (191m | 3分钟)</b>：哥特式教堂，充满欧式老电影感。最后顺路走南京路回酒店。'
                  ], 
                  images: [
                    'https://image.pollinations.ai/prompt/xiaohongshu_style_the_bund_shanghai_customs_house_night_blue_hour_aesthetic?width=400&height=520&nologo=true',
                    'https://image.pollinations.ai/prompt/xiaohongshu_style_waibaidu_bridge_shanghai_night_steel_structure_lujiazui_background?width=400&height=520&nologo=true',
                    'https://image.pollinations.ai/prompt/xiaohongshu_style_peace_hotel_shanghai_corner_street_night_vintage?width=400&height=520&nologo=true'
                  ]
                }]
              }
            ]
          },
          {
            date: '11/01', title: 'Day 2: 上海时空漫游', route: '武康路 ➔ 陆家嘴 ➔ 北外滩',
            items: [
              { time: '09:00-12:30', type: '景点', title: '武康路无折返漫游', desc: '保存最完好的历史风貌保护区，感受梧桐树下的老洋房。', location: '上海武康大楼', highlights: [{type: '必游', text: '船型老洋房全景'}],
                details: [{ 
                  title: '🗺️ 实测无折返路线（全程约45分钟）：', 
                  points: [
                    '<b>1. 交通大学站7号口 ➔ Teenie Weenie (330m | 7分钟)</b>：从特定角度刚好能用小熊窗户框住武康大楼。',
                    '<b>2. Teenie Weenie ➔ 宋庆龄故居 (133m | 3分钟)</b>：感受老上海的松弛与宁静。',
                    '<b>3. 宋庆龄故居 ➔ 武康大楼 (152m | 3分钟)</b>：魔都打卡首选核心地标，建议早点去避开人流。',
                    '<b>4. 武康大楼 ➔ 武康庭 (344m | 7分钟)</b>：老洋房与文艺小店并存，顺路买杯咖啡。',
                    '<b>5. 武康庭 ➔ 罗密欧阳台 (395m | 8分钟)</b>：西班牙式沿街小阳台，站在对面人行道拍全景。',
                    '<b>6. 罗密欧阳台 ➔ Wiggle Wiggle (503m | 9分钟)</b>：安福路超火的多巴胺彩色建筑。',
                    '<b>7. Wiggle Wiggle ➔ Looknow&Flow (493m | 7分钟)</b>：顶尖潮牌买手店，设计极具张力，结束漫游。'
                  ], 
                  images: [
                    'https://image.pollinations.ai/prompt/xiaohongshu_travel_wukang_mansion_shanghai_sycamore_trees_daytime_street_photography?width=400&height=520&nologo=true',
                    'https://image.pollinations.ai/prompt/xiaohongshu_style_wukang_road_cafe_shanghai_coffee_cup_sunlight?width=400&height=520&nologo=true'
                  ]
                }]
              },
              { time: '14:30-17:00', type: '景点', title: '上海中心大厦与北外滩', desc: '登上中国第一高楼，俯瞰黄浦江。', location: '上海中心大厦', highlights: [{type: '必点', text: '119层高空咖啡'}],
                details: [{ 
                  title: '🌆 登高与日落动线：', 
                  points: [
                    '打车穿过延安东路隧道跨江直达陆家嘴。',
                    '乘坐世界最快之一的高速电梯，直达118层“上海之巅”观光厅。',
                    '随后步行至北外滩国客中心，在巨型“魔都糖葫芦”银色球体机位，拍摄对岸夕阳下的摩天大楼。'
                  ],
                  images: [
                    'https://image.pollinations.ai/prompt/xiaohongshu_style_shanghai_tower_view_from_top_sunset_huangpu_river?width=400&height=520&nologo=true'
                  ]
                }]
              },
              { time: '17:30-21:30', type: '餐饮', title: '晚餐：老吉士(国金店)', desc: '上海最正宗的本帮菜之一。', location: '老吉士(国金中心商场店)', highlights: [{type: '必点', text: '吉士红烧肉'}, {type: '必点', text: '葱烤鱼头'}],
                details: [{
                  title: '🍴 推荐理由与控时：',
                  points: ['为了避免周日晚高峰跨江折返徐汇，特别优化至陆家嘴就近用餐。', '必点吉士红烧肉，浓油赤酱的上海风味代表。'],
                  images: ['https://image.pollinations.ai/prompt/xiaohongshu_food_shanghai_braised_pork_belly_shiny_glaze_restaurant?width=400&height=520&nologo=true']
                }]
              }
            ]
          },
          {
